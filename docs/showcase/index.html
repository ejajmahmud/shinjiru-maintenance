<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shinjiru — Maintenance collection</title><style>*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:#e8e8e3;color:#22251f}header{padding:25px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #cecec5;gap:20px}header strong{font-size:15px}header span{font-size:11px;color:#5e6458}.workspace{display:grid;grid-template-columns:230px 1fr;min-height:calc(100svh - 71px)}nav{padding:30px 16px}nav p{font-size:10px;letter-spacing:.15em;color:#666e5f;margin:0 12px 20px}button{font:inherit;cursor:pointer}nav button{display:flex;gap:16px;padding:16px 12px;width:100%;border:0;background:transparent;text-align:left;color:#50574b;border-radius:3px;font-size:12px}nav button span{color:#767e6d;font-size:10px}nav button[aria-pressed=true]{background:#fff;color:#22251f}.stage{min-width:0;padding:28px 28px 20px 0}.tools{display:flex;align-items:center;gap:8px;margin-bottom:16px}.tools button,.tools a{background:transparent;border:1px solid #b9beb1;padding:9px 12px;color:#3f4938;font-size:11px;text-decoration:none}.tools button[aria-pressed=true]{background:#273b2d;color:#fff}.tools a{margin-left:auto}.frame-wrap{display:flex;justify-content:center;background:#dcded6;padding:0;overflow:auto;border:1px solid #c9cec1}iframe{display:block;background:white;border:0;width:100%;height:760px;transition:width .2s}.caption{font-size:11px;color:#626a5a;line-height:1.6}:focus-visible{outline:2px solid #b2262b;outline-offset:3px}@media(max-width:800px){header{padding:20px}header span{display:none}.workspace{display:block}nav{display:flex;gap:5px;overflow:auto;padding:12px}nav p{display:none}nav button{width:auto;white-space:nowrap}.stage{padding:0 12px 20px}iframe{height:780px}}@media(prefers-reduced-motion:reduce){iframe{transition:none}}</style></head><body><header><strong>Shinjiru <span>/</span> Maintenance collection</strong><span>Six considered directions · HTML / CSS / JavaScript</span></header><div class="workspace"><nav aria-label="Choose a skin"><p>THE COLLECTION</p><button data-skin="editorial" aria-pressed="true"><span>01</span>Modern Editorial</button><button data-skin="minimal" aria-pressed="false"><span>02</span>Minimal</button><button data-skin="corporate" aria-pressed="false"><span>03</span>Corporate</button><button data-skin="dark-tech" aria-pressed="false"><span>04</span>After Hours</button><button data-skin="split" aria-pressed="false"><span>05</span>Architectural</button><button data-skin="calm-gradient" aria-pressed="false"><span>06</span>Soft Light</button></nav><main class="stage"><div class="tools"><button id="desktop" aria-pressed="true">Desktop</button><button id="mobile" aria-pressed="false">Mobile · 390</button><a id="open" href="preview_editorial.html" target="_blank" rel="noopener">Open skin ↗</a></div><div class="frame-wrap"><iframe src="preview_editorial.html" title="Modern Editorial skin preview" id="preview"></iframe></div><p class="caption" id="caption">Considered typography. Warm paper tones. Nothing unnecessary.</p><p class="caption">Static front-end collection. Staff authentication must be connected server-side in WordPress.</p></main></div><script>const descriptions={'editorial': 'Considered typography. Warm paper tones. Nothing unnecessary.', 'minimal': 'Quiet, focused and precise.', 'corporate': 'A clear notice for a business that never stands still.', 'dark-tech': 'Dark ink, sharp type and a restrained technical rhythm.', 'split': 'A bold split composition with an original architectural study.', 'calm-gradient': 'Soft colour and generous space, without the visual noise.'};const frame=document.getElementById('preview');document.querySelectorAll('[data-skin]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-skin]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));frame.src='preview_'+button.dataset.skin+'.html';frame.title=button.textContent+' skin preview';document.getElementById('open').href=frame.src;document.getElementById('caption').textContent=descriptions[button.dataset.skin];}));['desktop','mobile'].forEach(id=>document.getElementById(id).addEventListener('click',()=>{frame.style.width=id==='mobile'?'390px':'100%';['desktop','mobile'].forEach(x=>document.getElementById(x).setAttribute('aria-pressed',String(x===id)));}));</script></body></html>
